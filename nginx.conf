events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # C89.5 on-demand shows (mounted read-only from the host media dir).
        # Served directly with byte-range support; never falls back to the SPA.
        location /c895/ {
            try_files $uri =404;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "no-cache";
        }

        # Handle React Router (SPA routing)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite fingerprints these filenames, so they're safe to cache forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Other static files have stable names and can change between deploys,
        # so revalidate them instead of caching immutably (avoids stale assets).
        location ~* \.(png|jpg|jpeg|webp|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "no-cache";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
    }
}